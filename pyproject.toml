[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaquest-bio"
dynamic = ["version", "dependencies"]
description = "Research-use short-read metagenomics analysis pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "Dev Patel", email = "dev.patel@stud.uni-giessen.de" },
]

keywords = [
  "metagenomics",
  "bioinformatics",
  "taxonomic-classification",
  "microbiome-analysis",
  "genomics",
  "ngs",
  "fastq",
  "kraken2",
  "bracken",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.scripts]
metaquest = "metaquest.cli:main"

[project.optional-dependencies]
test = [
  "coverage>=7.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-timeout>=2.1.0",
]
dev = [
  "build>=1.2.2",
  "ipython>=8.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-timeout>=2.1.0",
  "ruff>=0.12.0",
  "twine>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/dpatel511/metaquest"
Issues = "https://github.com/dpatel511/metaquest/issues"
Documentation = "https://github.com/dpatel511/metaquest/blob/main/README.md"
Source = "https://github.com/dpatel511/metaquest"
Changelog = "https://github.com/dpatel511/metaquest/releases"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
metaquest = ["metaquest_default.yaml", "data/*.tsv"]

[tool.setuptools.dynamic]
version = { attr = "metaquest.config.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
