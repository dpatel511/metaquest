name: metaquest

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pip

  # External bioinformatics tools used by the maintained runtime
  - kraken2>=2.1.3
  - bracken>=3.1
  - megahit>=1.2.9
  - fastp>=0.23.4
  - diamond>=2.0.11,<2.1
  - eggnog-mapper=2.1.15
  - bbmap>=39

  # Python runtime
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.8
  - seaborn>=0.13
  - scipy>=1.11
  - biopython>=1.81
  - pyrodigal>=3.7.1,<4
  - pyyaml>=6.0

  # Verification used by the maintained test suite
  - pytest>=7
