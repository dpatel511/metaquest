name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install packaging
          PYTHONPATH=src python -c 'import os; from packaging.version import Version; from metaquest.config import __version__; tag=os.environ["RELEASE_TAG"]; assert Version(tag.removeprefix("v")) == Version(__version__), "tag {} does not match {}".format(tag, __version__)'
      - name: Run release checks
        run: |
          python -m pip install ".[test]" ruff
          ruff check src tests tools
          python -m pytest -q
          python tools/check_licenses.py
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/metaquest-bio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
