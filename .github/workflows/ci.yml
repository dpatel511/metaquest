name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip ".[test]" ruff
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: python -m pytest -q

  licenses:
    name: Direct dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip .
      - name: Check curated license expectations
        run: python tools/check_licenses.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/metaquest-wheel"
          "$RUNNER_TEMP/metaquest-wheel/bin/python" -m pip install dist/*.whl pytest
          cp -R tests "$RUNNER_TEMP/wheel-tests"
          cp -R tools benchmarks "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/metaquest-wheel/bin/metaquest" --version
          "$RUNNER_TEMP/metaquest-wheel/bin/python" -m pytest -q wheel-tests

  conda:
    name: Conda integration (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment/environment.yml
          cache-environment: true
          cache-downloads: true
      - name: Install MetaQuest
        shell: bash -el {0}
        run: python -m pip install --no-deps -e .
      - name: Install the isolated screening tool environment
        shell: bash -el {0}
        run: |
          micromamba create --yes --name metaquest-screening --file environment/screening.yml
          test -x "$MAMBA_ROOT_PREFIX/envs/metaquest-screening/bin/amrfinder"
          echo "$MAMBA_ROOT_PREFIX/envs/metaquest-screening/bin" >> "$GITHUB_PATH"
      - name: Verify external tools
        shell: bash -el {0}
        run: |
          kraken2 --version
          bracken -v
          megahit --version
          diamond version
          emapper.py --version
          amrfinder --version
      - name: Record screening tool version
        id: amr-version
        shell: bash -el {0}
        run: echo "version=$(amrfinder --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: test_results/ci-databases/amr
          key: amrfinderplus-${{ runner.os }}-${{ steps.amr-version.outputs.version }}-v1
      - name: Install and validate screening data through MetaQuest
        shell: bash -el {0}
        run: metaquest --no-color databases --database amr --db-dir test_results/ci-databases
      - name: Run tests in the complete tool environment
        shell: bash -el {0}
        env:
          METAQUEST_TEST_AMR_DB: ${{ github.workspace }}/test_results/ci-databases/amr
        run: python -m pytest -q --junitxml=test_results/ci-native-tests.xml
      - name: Retain native test and database provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integration-evidence
          path: |
            test_results/ci-native-tests.xml
            test_results/ci-databases/amr/metaquest-db.json
          if-no-files-found: warn
