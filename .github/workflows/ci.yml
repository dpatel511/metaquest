name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip ".[test]" ruff
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: python -m pytest -q

  licenses:
    name: Direct dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip .
      - name: Check curated license expectations
        run: python tools/check_licenses.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          metaquest --version

  conda:
    name: Conda integration (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment/environment.yml
          cache-environment: true
          cache-downloads: true
      - name: Install MetaQuest
        shell: bash -el {0}
        run: python -m pip install --no-deps -e .
      - name: Verify external tools
        shell: bash -el {0}
        run: |
          kraken2 --version
          bracken -v
          megahit --version
          diamond version
          emapper.py --version
      - name: Run tests in the complete tool environment
        shell: bash -el {0}
        run: python -m pytest -q
